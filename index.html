<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Tasks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Daily Tasks</h1>
  <nav>
    <button data-view="tasks" class="tab active">Tasks</button>
    <button data-view="map" class="tab">Mind map</button>
  </nav>
</header>

<main id="tasks-view">
  <div class="daynav">
    <button id="prev" aria-label="Previous day">&larr;</button>
    <input type="date" id="date">
    <button id="next" aria-label="Next day">&rarr;</button>
    <button id="today">Today</button>
  </div>
  <h2 id="day-title"></h2>
  <p id="day-stats" class="muted"></p>
  <form id="add">
    <input id="text" placeholder="Add a task and press Enter" autocomplete="off" required>
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <div class="footer-actions">
    <button id="carry" title="Copy unfinished tasks from the previous day with tasks">Carry over unfinished</button>
    <button id="export">Export</button>
    <label class="btn">Import<input type="file" id="import" accept="application/json" hidden></label>
  </div>
</main>

<main id="map-view" hidden>
  <div class="map-bar">
    <label>Show
      <select id="range">
        <option value="7">last 7 days</option>
        <option value="14">last 14 days</option>
        <option value="30" selected>last 30 days</option>
        <option value="0">all days</option>
      </select>
    </label>
    <span class="muted">Drag to pan, scroll to zoom, click a day to open it.</span>
    <button id="fit">Fit</button>
  </div>
  <svg id="map"></svg>
</main>

<script src="app.js"></script>
</body>
</html>

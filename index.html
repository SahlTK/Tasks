<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Tasks</title>
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tasks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<script>try{var k=localStorage.getItem('daily-tasks-skin');if(k&&k!=='system')document.documentElement.dataset.skin=k}catch(e){}</script>
</head>
<body>
<header>
  <h1>Daily Tasks</h1>
  <nav>
    <select id="skin" aria-label="Theme">
      <option value="system">Theme: Auto</option>
      <option value="midnight">Midnight</option>
      <option value="neon">Neon</option>
      <option value="forest">Forest</option>
      <option value="sunset">Sunset</option>
      <option value="mono">Mono</option>
      <option value="sky">Sky</option>
    </select>
    <button data-view="tasks" class="tab active">Tasks</button>
    <button data-view="map" class="tab">Mind map</button>
  </nav>
</header>

<main id="tasks-view">
  <div class="daynav">
    <button id="prev" aria-label="Previous day">&larr;</button>
    <input type="date" id="date">
    <button id="next" aria-label="Next day">&rarr;</button>
    <button id="today">Today</button>
  </div>
  <h2 id="day-title"></h2>
  <p id="day-stats" class="muted"></p>
  <form id="add">
    <input id="text" placeholder="Add a task and press Enter" autocomplete="off" required>
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <details id="recurring">
    <summary>Recurring tasks</summary>
    <form id="r-form">
      <input id="r-text" placeholder="e.g. Gym" autocomplete="off" required>
      <select id="r-freq">
        <option value="daily">Every day</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
      <div id="r-days" hidden>
        <label><input type="checkbox" value="1">Mon</label>
        <label><input type="checkbox" value="2">Tue</label>
        <label><input type="checkbox" value="3">Wed</label>
        <label><input type="checkbox" value="4">Thu</label>
        <label><input type="checkbox" value="5">Fri</label>
        <label><input type="checkbox" value="6">Sat</label>
        <label><input type="checkbox" value="0">Sun</label>
      </div>
      <button>Add recurring</button>
    </form>
    <p class="muted">Starts on the day you're viewing. Monthly repeats on that day's date.</p>
    <ul id="rules"></ul>
  </details>
  <div class="footer-actions">
    <button id="carry" title="Copy unfinished tasks from the previous day with tasks">Carry over unfinished</button>
    <button id="export">Export (copy)</button>
    <label class="btn">Import file<input type="file" id="import" accept="application/json" hidden></label>
  </div>
  <textarea id="backup" hidden aria-label="Backup data"></textarea>
  <button id="paste-import" hidden>Import pasted text</button>
</main>

<main id="map-view" hidden>
  <div class="map-bar">
    <label>View
      <select id="mode"><option value="web" selected>Web</option><option value="tree">Tree</option></select>
    </label>
    <label>Show
      <select id="range">
        <option value="7">last 7 days</option>
        <option value="14">last 14 days</option>
        <option value="30" selected>last 30 days</option>
        <option value="0">all days</option>
      </select>
    </label>
    <span class="legend">
      <i style="--c:#5fb8ff"></i>Open <i style="--c:#5fe08f"></i>Done <i style="--c:#f2a65a"></i>Recurring <i style="--c:#e9edf5"></i>Day
    </span>
    <button id="fit">Fit</button>
  </div>
  <div id="stage">
    <canvas id="web"></canvas>
    <svg id="map" hidden></svg>
  </div>
  <p class="hint muted">Drag to pan or move nodes, scroll to zoom, click a day to open it. Hover a node to read it.</p>
</main>

<script src="app.js"></script>
</body>
</html>
